<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>fogofwAR Map</title>
  <link rel="icon" type="image/png" href="favicon.png?v=favicon-20260603">
  <link rel="manifest" href="manifest.webmanifest?v=favicon-20260603">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=fog-sync-20260603">
</head>
<body>
  <main id="app" aria-label="Live location map">
    <div id="map" role="application" aria-label="Map centered on your live location"></div>
    <div
      id="zoom-slider"
      class="zoom-slider"
      role="slider"
      aria-label="Map zoom"
      aria-orientation="vertical"
      aria-valuemin="3"
      aria-valuemax="19"
      aria-valuenow="4"
      tabindex="-1"
    >
      <div class="zoom-slider__track" aria-hidden="true">
        <div class="zoom-slider__fill"></div>
        <div class="zoom-slider__thumb"></div>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="map.js?v=fog-sync-20260603" defer></script>
</body>
</html>
